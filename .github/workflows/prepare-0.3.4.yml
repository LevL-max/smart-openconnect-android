name: Prepare 0.3.4 build workflow

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-0.3.4.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch main workflow for 0.3.4
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('.github/workflows/main.yml')
          s = p.read_text(encoding='utf-8')

          def one(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              s = s.replace(old, new, 1)

          one('name: Build Smart Open Connect 0.3.3',
              'name: Build Smart Open Connect 0.3.4', 'workflow name')
          one('      - smart-openconnect-0.3.3-release.py\n      - .github/workflows/**',
              '      - smart-openconnect-0.3.3-release.py\n      - smart-openconnect-0.3.4-release.py\n      - .github/workflows/**',
              'push path')
          one('          test -s smart-openconnect-0.3.3-release.py\n',
              '          test -s smart-openconnect-0.3.3-release.py\n          test -s smart-openconnect-0.3.4-release.py\n',
              'verify overlay')

          anchor = '''      - name: Build native arm64-v8a\n'''
          step = '''      - name: Apply 0.3.4 GUI selection hotfix\n        run: |\n          python3 smart-openconnect-0.3.4-release.py\n          grep -q 'versionCode 7' source/app/build.gradle\n          grep -q 'versionName "0.3.4"' source/app/build.gradle\n          grep -q 'rememberRecent(profile);' source/app/src/main/java/net/openconnect_vpn/android/fragments/ConnectFragment.java\n          grep -q 'putString(ConnectFragment.PREF_SELECTED_PROFILE, profile.getUUIDString()).commit();' source/app/src/main/java/net/openconnect_vpn/android/fragments/VPNProfileList.java\n          test "$(grep -o 'android:id="@+id/recent_profile_' source/app/src/main/res/layout/connect.xml | wc -l)" -eq 3\n\n'''
          one(anchor, step + anchor, '0.3.4 build step')

          for old, new, label in [
              ('--out SmartOpenConnect-0.3.3-arm64.apk', '--out SmartOpenConnect-0.3.4-arm64.apk', 'sign output'),
              ('test -s SmartOpenConnect-0.3.3-arm64.apk', 'test -s SmartOpenConnect-0.3.4-arm64.apk', 'signed apk check'),
              ('apksigner verify --print-certs SmartOpenConnect-0.3.3-arm64.apk', 'apksigner verify --print-certs SmartOpenConnect-0.3.4-arm64.apk', 'signature verify'),
              ('aapt" dump badging SmartOpenConnect-0.3.3-arm64.apk', 'aapt" dump badging SmartOpenConnect-0.3.4-arm64.apk', 'aapt target'),
              ('grep -q "versionCode=\'6\'" apk-badging.txt', 'grep -q "versionCode=\'7\'" apk-badging.txt', 'badging code'),
              ('grep -q "versionName=\'0.3.3\'" apk-badging.txt', 'grep -q "versionName=\'0.3.4\'" apk-badging.txt', 'badging name'),
              ('sha256sum SmartOpenConnect-0.3.3-arm64.apk > SmartOpenConnect-0.3.3-arm64.apk.sha256', 'sha256sum SmartOpenConnect-0.3.4-arm64.apk > SmartOpenConnect-0.3.4-arm64.apk.sha256', 'checksum'),
              ('name: SmartOpenConnect-0.3.3-arm64\n', 'name: SmartOpenConnect-0.3.4-arm64\n', 'artifact name'),
              ('            SmartOpenConnect-0.3.3-arm64.apk\n            SmartOpenConnect-0.3.3-arm64.apk.sha256', '            SmartOpenConnect-0.3.4-arm64.apk\n            SmartOpenConnect-0.3.4-arm64.apk.sha256', 'artifact files'),
          ]:
              one(old, new, label)

          p.write_text(s, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/prepare-0.3.4.yml
          git add .github/workflows/main.yml
          git commit -m 'Build Smart Open Connect 0.3.4 GUI hotfix'
          git push origin HEAD:main
