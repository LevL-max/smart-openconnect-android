name: Promote Smart Open Connect 0.3.10 stable

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/promote-0.3.10.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Promote v0.3.10 and refresh release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REL_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.3.10" --jq '.id')"
          test -n "$REL_ID"
          BODY="$(cat RELEASE_NOTES_0.3.10.md)"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$REL_ID" \
            -f name='Smart Open Connect v0.3.10' \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true \
            -f body="$BODY"

      - name: Verify stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.3.10 --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,url
