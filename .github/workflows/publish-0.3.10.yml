name: Publish Smart Open Connect 0.3.10 prerelease

on:
  push:
    branches:
      - fix/stale-connect-0310
    paths:
      - .github/workflows/publish-0.3.10.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download exact tested artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-artifact
          gh run download 36339524568 \
            --repo "$GITHUB_REPOSITORY" \
            --name SmartOpenConnect-0.3.10-arm64 \
            --dir release-artifact
          test -s release-artifact/SmartOpenConnect-0.3.10-arm64.apk
          test -s release-artifact/SmartOpenConnect-0.3.10-arm64.apk.sha256

      - name: Verify exact APK checksum
        run: |
          cd release-artifact
          echo 'eba93c20bd253abce64741238232700c08c3fc886dbe148c7528f6c645803976  SmartOpenConnect-0.3.10-arm64.apk' | sha256sum -c -
          grep -q '^eba93c20bd253abce64741238232700c08c3fc886dbe148c7528f6c645803976  SmartOpenConnect-0.3.10-arm64.apk$' SmartOpenConnect-0.3.10-arm64.apk.sha256

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.10 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release v0.3.10 already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          gh release create v0.3.10 \
            release-artifact/SmartOpenConnect-0.3.10-arm64.apk \
            release-artifact/SmartOpenConnect-0.3.10-arm64.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target 767de5c8f6d227eb87c103d7783491cacd7488a1 \
            --title 'Smart Open Connect v0.3.10' \
            --notes-file RELEASE_NOTES_0.3.10.md \
            --prerelease

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.3.10 --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,url
