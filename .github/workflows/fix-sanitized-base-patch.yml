name: Fix sanitized base patch hunk count

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-sanitized-base-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Correct SmartRelaySelector hunk line count
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('smart-openconnect-0.2-ui.patch')
          s = p.read_text(encoding='utf-8')
          old = '@@ -0,0 +1,442 @@'
          new = '@@ -0,0 +1,436 @@'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one stale hunk header, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add smart-openconnect-0.2-ui.patch
          git commit -m 'Repair sanitized SmartRelaySelector patch hunk'
          git push origin HEAD:main
